services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alibi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alibi"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - clickhouse

  # --- Application services (start with: docker compose --profile app up -d --build) ---
  # Each service gets an explicit allow-list of variables (least privilege): the
  # API never sees the Brevo SMTP password, the worker never sees JWT_SECRET or
  # the database URIs. Values come from .env through ${VAR} interpolation; an
  # unset optional variable is passed as empty and the app falls back to its
  # default; required ones (JWT_SECRET, BREVO_*) are validated by the app at
  # startup, so infra-only `docker compose up` works without them. The *_URI / endpoint values below point the containers at each
  # other by service name instead of localhost.

  api:
    profiles: ["app"]
    build:
      context: ./backend
      target: api
    environment:
      POSTGRES_URI: postgres://postgres:password@postgres:5432/alibi?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      REDIS_URI: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
      OLLAMA_HOST: http://host.docker.internal:11434
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-}
      HTTP_WRITE_TIMEOUT_SECONDS: ${HTTP_WRITE_TIMEOUT_SECONDS:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-}
      OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-}
      OTP_EMAIL_DAILY_MAX: ${OTP_EMAIL_DAILY_MAX:-}
      OTP_IP_MAX: ${OTP_IP_MAX:-}
      OTP_IP_WINDOW_MINUTES: ${OTP_IP_WINDOW_MINUTES:-}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-}
      AUTH_IP_MAX: ${AUTH_IP_MAX:-}
      AUTH_IP_WINDOW_MINUTES: ${AUTH_IP_WINDOW_MINUTES:-}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-}
      BCRYPT_WORKERS: ${BCRYPT_WORKERS:-}
      # Loopback only unless you set it: list your reverse proxy / load balancer here.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PG_MAX_CONNS: ${PG_MAX_CONNS:-}
      PG_MIN_CONNS: ${PG_MIN_CONNS:-}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # The email worker is a separate service: it consumes queue:email:outbound and
  # sends through Brevo. It has no published port, so it can be scaled:
  #   docker compose --profile app up -d --scale email-worker=3
  email-worker:
    profiles: ["app"]
    build:
      context: ./backend
      target: worker
    environment:
      REDIS_URI: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
      WORKER_HTTP_ADDR: ":8081"
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_MONITOR_SECONDS: ${WORKER_MONITOR_SECONDS:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-}
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  clickhouse_data:
